<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云盘</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <style>
        .drive-page {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .drive-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 1.5rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            text-align: center;
        }
        .drive-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .drive-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            letter-spacing: 0.05em;
        }
        .drive-desc {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .drive-input-wrap {
            margin-bottom: 1.25rem;
            text-align: left;
        }
        .drive-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .drive-input {
            width: 100%;
            padding: 0.875rem 1.25rem;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .drive-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .drive-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.05em;
        }
        .drive-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .drive-btn:active {
            transform: translateY(0);
        }
        .drive-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .drive-error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.75rem;
            display: none;
            text-align: center;
        }
        .drive-disabled {
            color: var(--text-secondary);
            padding: 1rem;
        }
        .drive-loading {
            color: var(--text-secondary);
            padding: 2rem;
        }
        .drive-divider {
            height: 1px;
            background: var(--border-color);
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>
    <!-- 页面加载动画 -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
    </div>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="/">My Site</a>
            </div>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/about/">关于我</a></li>
                <li><a href="/blog/">博客</a></li>
                <li><a href="/drive/" class="active">云盘</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="drive-page">
            <div id="driveContent" class="drive-card">
                <div class="drive-loading">加载中...</div>
            </div>
        </div>
    </main>

    <script src="../assets/js/main.js"></script>
    <script>
        let driveSettings = null;

        async function loadDriveSettings() {
            try {
                const response = await fetch('/api/drive-settings');
                const data = await response.json();
                if (data.success) {
                    driveSettings = data.data;
                    renderDrivePage();
                } else {
                    showError('加载失败');
                }
            } catch (err) {
                console.error(err);
                showError('网络错误');
            }
        }

        function renderDrivePage() {
            const container = document.getElementById('driveContent');

            if (!driveSettings.enabled) {
                container.innerHTML = `
                    <span class="drive-icon">🔒</span>
                    <div class="drive-title">云盘未启用</div>
                    <div class="drive-disabled">管理员暂未开放云盘访问</div>
                `;
                return;
            }

            if (driveSettings.requirePassword) {
                container.innerHTML = `
                    <span class="drive-icon">☁️</span>
                    <div class="drive-title">${escapeHtml(driveSettings.title || '我的云盘')}</div>
                    <div class="drive-desc">${escapeHtml(driveSettings.description || '请输入提取密码访问云盘')}</div>
                    <div class="drive-divider"></div>
                    <div class="drive-input-wrap">
                        <label class="drive-label">提取密码</label>
                        <input type="password" id="passwordInput" class="drive-input" placeholder="请输入提取密码" onkeydown="if(event.key==='Enter')verifyPassword()">
                    </div>
                    <button class="drive-btn" onclick="verifyPassword()" id="verifyBtn">进入云盘</button>
                    <div class="drive-error" id="errorMsg"></div>
                `;
            } else {
                container.innerHTML = `
                    <span class="drive-icon">☁️</span>
                    <div class="drive-title">${escapeHtml(driveSettings.title || '我的云盘')}</div>
                    <div class="drive-desc">${escapeHtml(driveSettings.description || '点击下方按钮进入云盘')}</div>
                    <div class="drive-divider"></div>
                    <button class="drive-btn" onclick="goToDrive()">进入云盘</button>
                `;
            }
        }

        async function verifyPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const verifyBtn = document.getElementById('verifyBtn');

            if (!password) {
                errorMsg.textContent = '请输入提取密码';
                errorMsg.style.display = 'block';
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = '验证中...';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/drive-settings/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await response.json();

                if (data.success && data.redirectUrl) {
                    window.location.href = data.redirectUrl;
                } else {
                    errorMsg.textContent = data.message || '验证失败';
                    errorMsg.style.display = 'block';
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = '进入云盘';
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = '网络错误';
                errorMsg.style.display = 'block';
                verifyBtn.disabled = false;
                verifyBtn.textContent = '进入云盘';
            }
        }

        async function goToDrive() {
            try {
                const response = await fetch('/api/drive-settings/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await response.json();
                if (data.success && data.redirectUrl) {
                    window.location.href = data.redirectUrl;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', loadDriveSettings);
    </script>
</body>
</html>
