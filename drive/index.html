<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云盘</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <style>
        .drive-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .drive-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .drive-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .drive-header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .drive-toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .drive-search {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .drive-search input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .drive-search input:focus {
            outline: none;
            border-color: var(--primary-color, #667eea);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .drive-search::before {
            content: "🔍";
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
        }

        .drive-stats {
            display: flex;
            gap: 1.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--card-bg);
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .drive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .file-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.25rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .file-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border-color: var(--primary-color, #667eea);
        }

        .file-card-header {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            margin-bottom: 1rem;
        }

        .file-icon {
            font-size: 2rem;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary, #f3f4f6);
            border-radius: 0.5rem;
            flex-shrink: 0;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0.875rem;
            border-top: 1px solid var(--border-color);
        }

        .extract-code {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .extract-code span {
            background: var(--bg-secondary, #f3f4f6);
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            font-family: monospace;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.75rem;
        }

        .jump-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.4rem 0.875rem;
            background: var(--primary-color, #667eea);
            color: white;
            text-decoration: none;
            border-radius: 0.375rem;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }

        .jump-btn:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        .jump-btn.disabled {
            background: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .jump-btn.disabled:hover {
            transform: none;
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        @media (max-width: 640px) {
            .drive-header h1 {
                font-size: 1.5rem;
            }
            .drive-grid {
                grid-template-columns: 1fr;
            }
            .drive-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .drive-stats {
                justify-content: center;
            }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-card {
            animation: fadeInUp 0.3s ease backwards;
        }
    </style>
</head>
<body>
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
    </div>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="/">My Site</a>
            </div>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/about/">关于我</a></li>
                <li><a href="/blog/">博客</a></li>
                <li><a href="/drive/" class="active">云盘</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="drive-page">
            <div class="drive-header">
                <h1 id="driveTitle">我的云盘</h1>
                <p id="driveDesc">点击卡片跳转至对应资源</p>
            </div>

            <div class="drive-toolbar">
                <div class="drive-search">
                    <input type="text" id="searchInput" placeholder="搜索文件名或说明...">
                </div>
                <div class="drive-stats" id="driveStats" style="display:none;">
                    <div class="stat-item">
                        <div class="stat-number" id="totalCount">0</div>
                        <div class="stat-label">个文件</div>
                    </div>
                </div>
            </div>

            <div class="drive-grid" id="driveGrid">
                <!-- 文件卡片动态生成 -->
            </div>
        </div>
    </main>

    <script src="../assets/js/main.js"></script>
    <script>
        let allItems = [];

        async function loadDrivePage() {
            try {
                const settingsRes = await fetch('/api/drive-settings');
                const settingsData = await settingsRes.json();
                if (settingsData.success) {
                    document.getElementById('driveTitle').textContent = settingsData.data.title || '我的云盘';
                    document.getElementById('driveDesc').textContent = settingsData.data.description || '点击卡片跳转至对应资源';

                    if (!settingsData.data.enabled) {
                        document.getElementById('driveGrid').innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">🔒</div>
                                <h3>云盘未启用</h3>
                                <p>管理员暂未开放云盘访问</p>
                            </div>
                        `;
                        return;
                    }
                }

                const itemsRes = await fetch('/api/drive-items');
                const itemsData = await itemsRes.json();
                if (itemsData.success) {
                    allItems = itemsData.data;
                    renderDriveItems(allItems);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('driveGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>加载失败</h3>
                        <p>请稍后重试</p>
                    </div>
                `;
            }
        }

        function renderDriveItems(items) {
            const grid = document.getElementById('driveGrid');
            const stats = document.getElementById('driveStats');

            if (!items || items.length === 0) {
                stats.style.display = 'none';
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📂</div>
                        <h3>暂无文件</h3>
                        <p>管理员还未添加任何文件</p>
                    </div>
                `;
                return;
            }

            stats.style.display = 'flex';
            document.getElementById('totalCount').textContent = items.length;

            grid.innerHTML = items.map((item, index) => `
                <div class="file-card" style="animation-delay:${index * 0.05}s" onclick="${item.url ? `window.open('${escapeAttr(item.url)}', '_blank')` : ''}">
                    <div class="file-card-header">
                        <div class="file-icon">${escapeHtml(item.icon || '📁')}</div>
                        <div class="file-info">
                            <div class="file-name">${escapeHtml(item.name)}</div>
                            <div class="file-desc">${escapeHtml(item.description || '暂无说明')}</div>
                        </div>
                    </div>
                    <div class="file-meta">
                        <div class="extract-code">
                            ${item.extractCode ? `提取码: <span>${escapeHtml(item.extractCode)}</span>` : '<span style="background:transparent;padding:0;">无提取码</span>'}
                        </div>
                        ${item.url ? 
                            `<a href="${escapeAttr(item.url)}" target="_blank" rel="noopener" class="jump-btn" onclick="event.stopPropagation()">跳转 →</a>` : 
                            `<span class="jump-btn disabled">暂无链接</span>`
                        }
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();
            if (!keyword) {
                renderDriveItems(allItems);
                return;
            }
            const filtered = allItems.filter(item => 
                item.name.toLowerCase().includes(keyword) ||
                (item.description && item.description.toLowerCase().includes(keyword))
            );
            renderDriveItems(filtered);
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        document.addEventListener('DOMContentLoaded', loadDrivePage);
    </script>
</body>
</html>
