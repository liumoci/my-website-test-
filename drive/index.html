<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云盘</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <style>
        .drive-page {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .drive-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .drive-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .drive-desc {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .drive-table-container {
            background: var(--card-bg);
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid var(--border-color);
        }
        .drive-table {
            width: 100%;
            border-collapse: collapse;
        }
        .drive-table thead {
            background: var(--bg-secondary, #f9fafb);
            border-bottom: 2px solid var(--border-color);
        }
        .drive-table th {
            padding: 1rem 1.25rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .drive-table td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: middle;
        }
        .drive-table tbody tr:last-child td {
            border-bottom: none;
        }
        .drive-table tbody tr:hover {
            background: var(--bg-secondary, #f9fafb);
        }
        .file-name-cell {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .file-icon {
            font-size: 1.75rem;
            flex-shrink: 0;
        }
        .file-name {
            font-weight: 500;
            font-size: 1rem;
        }
        .file-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .extract-code {
            font-family: monospace;
            background: var(--bg-secondary, #f3f4f6);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .jump-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
        }
        .jump-link:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }
        .jump-link.disabled {
            color: var(--text-secondary);
            cursor: not-allowed;
            text-decoration: none;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }
        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        .col-checkbox {
            width: 40px;
        }
        .col-name {
            min-width: 200px;
        }
        .col-desc {
            min-width: 250px;
        }
        .col-code {
            width: 120px;
        }
        .col-action {
            width: 100px;
            text-align: right;
        }
        @media (max-width: 768px) {
            .drive-table thead {
                display: none;
            }
            .drive-table, .drive-table tbody, .drive-table tr, .drive-table td {
                display: block;
                width: 100%;
            }
            .drive-table tr {
                padding: 1rem;
                border-bottom: 1px solid var(--border-color);
            }
            .drive-table td {
                border: none;
                padding: 0.25rem 0;
            }
            .col-action {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
    </div>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="/">My Site</a>
            </div>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/about/">关于我</a></li>
                <li><a href="/blog/">博客</a></li>
                <li><a href="/drive/" class="active">云盘</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="drive-page">
            <div class="drive-header">
                <h1 class="drive-title" id="driveTitle">我的云盘</h1>
                <p class="drive-desc" id="driveDesc">点击链接跳转至对应资源</p>
            </div>
            <div class="drive-table-container">
                <table class="drive-table">
                    <thead>
                        <tr>
                            <th class="col-checkbox"></th>
                            <th class="col-name">文档名称</th>
                            <th class="col-desc">说明</th>
                            <th class="col-code">提取码</th>
                            <th class="col-action"></th>
                        </tr>
                    </thead>
                    <tbody id="driveTableBody">
                        <tr>
                            <td colspan="5">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📂</div>
                                    <div>加载中...</div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../assets/js/main.js"></script>
    <script>
        async function loadDrivePage() {
            try {
                // 加载设置
                const settingsRes = await fetch('/api/drive-settings');
                const settingsData = await settingsRes.json();
                if (settingsData.success) {
                    document.getElementById('driveTitle').textContent = settingsData.data.title || '我的云盘';
                    document.getElementById('driveDesc').textContent = settingsData.data.description || '点击链接跳转至对应资源';
                }

                // 加载文件列表
                const itemsRes = await fetch('/api/drive-items');
                const itemsData = await itemsRes.json();
                if (itemsData.success) {
                    renderDriveItems(itemsData.data);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('driveTableBody').innerHTML = `
                    <tr><td colspan="5"><div class="empty-state"><div class="empty-state-icon">⚠️</div><div>加载失败</div></div></td></tr>
                `;
            }
        }

        function renderDriveItems(items) {
            const tbody = document.getElementById('driveTableBody');

            if (!items || items.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="5">
                        <div class="empty-state">
                            <div class="empty-state-icon">📂</div>
                            <div>暂无文件</div>
                        </div>
                    </td></tr>
                `;
                return;
            }

            tbody.innerHTML = items.map(item => `
                <tr>
                    <td class="col-checkbox"></td>
                    <td class="col-name">
                        <div class="file-name-cell">
                            <span class="file-icon">${escapeHtml(item.icon || (item.type === 'folder' ? '📁' : '📄'))}</span>
                            <span class="file-name">${escapeHtml(item.name)}</span>
                        </div>
                    </td>
                    <td class="col-desc">
                        <span class="file-desc">${escapeHtml(item.description || '-')}</span>
                    </td>
                    <td class="col-code">
                        ${item.extractCode ? `<span class="extract-code">${escapeHtml(item.extractCode)}</span>` : '-'}
                    </td>
                    <td class="col-action">
                        ${item.url ? 
                            `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener" class="jump-link">点击跳转</a>` : 
                            `<span class="jump-link disabled">暂无链接</span>`
                        }
                    </td>
                </tr>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', loadDrivePage);
    </script>
</body>
</html>
