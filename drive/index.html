<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云盘 - 正在跳转...</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <meta http-equiv="refresh" content="3;url=https://drive.liumoci.dpdns.org">
    <style>
        .drive-redirect {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .drive-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: float 2s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .drive-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .drive-desc {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        .drive-btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .drive-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .drive-tip {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- 页面加载动画 -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
    </div>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="/">My Site</a>
            </div>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/about/">关于我</a></li>
                <li><a href="/blog/">博客</a></li>
                <li><a href="/drive/" class="active">云盘</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="drive-redirect">
            <div class="drive-icon">☁️</div>
            <div class="drive-title">我的云盘</div>
            <div class="drive-desc">基于 Cloudflare R2 的在线文件存储</div>
            <a href="https://drive.liumoci.dpdns.org" class="drive-btn">立即进入 →</a>
            <div class="drive-tip">3 秒后自动跳转，如未跳转请点击上方按钮</div>
        </div>
    </main>

    <script src="../assets/js/main.js"></script>
</body>
</html>
