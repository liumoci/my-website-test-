<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #e8f0f7;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .blog-navbar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .blog-nav-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a1a2e;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .blog-nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .blog-nav-links a {
            color: #555;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .blog-nav-links a:hover {
            color: #667eea;
        }

        /* 三栏布局 */
        .blog-layout {
            max-width: 1600px;
            margin: 0 auto;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 260px 1fr 300px;
            gap: 1.5rem;
        }

        /* 侧边栏通用 */
        .sidebar {
            position: sticky;
            top: 80px;
            align-self: start;
        }

        .sidebar-card {
            background: white;
            border-radius: 1rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        /* 左侧 - 个人资料卡 */
        .profile-card {
            text-align: center;
            overflow: hidden;
            padding: 0;
        }

        .profile-cover {
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: -45px auto 0.75rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            border: 4px solid white;
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 0.25rem;
        }

        .profile-bio {
            font-size: 0.85rem;
            color: #666;
            padding: 0 1rem 1rem;
            line-height: 1.5;
        }

        .profile-social {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 0 1rem 1.25rem;
            flex-wrap: wrap;
        }

        .social-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .social-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        /* 侧边栏标题 */
        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 0.75rem;
            padding-left: 0.5rem;
            border-left: 3px solid #667eea;
        }

        /* 分类列表 */
        .category-list, .tag-list {
            list-style: none;
        }

        .category-list li {
            padding: 0.5rem 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: #555;
            font-size: 0.9rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }

        .category-list li:hover {
            background: #f0f2f5;
            color: #667eea;
        }

        .category-list li.active {
            background: #eef0ff;
            color: #667eea;
            font-weight: 600;
        }

        .category-count {
            background: #f0f2f5;
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.75rem;
        }

        .category-list li.active .category-count {
            background: #667eea;
            color: white;
        }

        /* 标签云 */
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .tag-list li {
            padding: 0.25rem 0.6rem;
            background: #f0f2f5;
            border-radius: 1rem;
            font-size: 0.8rem;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-list li:hover {
            background: #667eea;
            color: white;
        }

        .tag-list li.active {
            background: #667eea;
            color: white;
        }

        /* 中间内容区 */
        .main-content {
            min-width: 0;
        }

        /* 筛选标签栏 */
        .filter-bar {
            background: white;
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .filter-tab {
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            cursor: pointer;
            color: #555;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .filter-tab:hover {
            background: #f0f2f5;
        }

        .filter-tab.active {
            background: #667eea;
            color: white;
        }

        .filter-tab .count {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        /* 文章网格 */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        /* 文章卡片 - 图片在上，标题在下 */
        .post-card {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .post-card.pinned {
            border: 2px solid #f59e0b;
        }

        .post-cover {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            overflow: hidden;
            position: relative;
        }

        .post-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-pinned-badge {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background: #f59e0b;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 0.3rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .post-body {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .post-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .post-meta-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .post-category {
            color: #667eea;
            font-weight: 500;
        }

        .post-excerpt {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .post-tags {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .post-tag {
            font-size: 0.75rem;
            color: #667eea;
            background: #eef0ff;
            padding: 0.15rem 0.5rem;
            border-radius: 1rem;
        }

        /* 右侧边栏小部件 */
        .widget-clock {
            text-align: center;
        }

        .widget-greeting {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.25rem;
        }

        .widget-time {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a2e;
            font-family: 'Courier New', monospace;
        }

        .widget-date {
            font-size: 0.8rem;
            color: #888;
            margin-top: 0.25rem;
        }

        .widget-cover {
            width: 100%;
            height: 100px;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            overflow: hidden;
        }

        .widget-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 最新动态 */
        .recent-list {
            list-style: none;
        }

        .recent-item {
            padding: 0.6rem 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: color 0.2s;
        }

        .recent-item:last-child {
            border-bottom: none;
        }

        .recent-item:hover {
            color: #667eea;
        }

        .recent-title {
            font-size: 0.85rem;
            color: #333;
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .recent-date {
            font-size: 0.75rem;
            color: #999;
        }

        /* 空状态 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 1rem;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            color: #333;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: #888;
            font-size: 0.9rem;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .blog-layout {
                grid-template-columns: 240px 1fr;
            }
            .right-sidebar {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .blog-layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
            .posts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="blog-navbar">
        <a href="/" class="blog-nav-brand" id="blogSiteName">📝 我的博客</a>
        <div class="blog-nav-links">
            <a href="/">🏠 首页</a>
            <a href="/about/">👤 关于</a>
            <a href="/drive/">☁️ 云盘</a>
            <a href="/guestbook/">💬 留言</a>
            <a href="/admin/">⚙️ 管理</a>
        </div>
    </nav>

    <div class="blog-layout">
        <!-- 左侧边栏 -->
        <aside class="sidebar left-sidebar">
            <!-- 个人资料卡 -->
            <div class="sidebar-card profile-card">
                <div class="profile-cover"></div>
                <div class="profile-avatar" id="blogProfileAvatar">📝</div>
                <div class="profile-name" id="blogProfileName">我的博客</div>
                <div class="profile-bio" id="blogProfileBio">记录生活与技术</div>
                <div class="profile-social" id="profileSocial">
                    <!-- 联系方式图标由JS动态生成 -->
                </div>
            </div>

            <!-- 分类 -->
            <div class="sidebar-card">
                <div class="sidebar-title">📂 分类</div>
                <ul class="category-list" id="categoryList">
                    <li>加载中...</li>
                </ul>
            </div>

            <!-- 标签 -->
            <div class="sidebar-card">
                <div class="sidebar-title">🏷️ 标签</div>
                <ul class="tag-list" id="tagList">
                    <li>暂无标签</li>
                </ul>
            </div>
        </aside>

        <!-- 中间内容区 -->
        <main class="main-content">
            <!-- 筛选栏 -->
            <div class="filter-bar" id="filterBar">
                <div class="filter-tab active" data-filter="all">全部 <span class="count" id="allCount">0</span></div>
            </div>

            <!-- 文章列表 -->
            <div class="posts-grid" id="postsGrid">
                <div class="empty-state">
                    <div class="empty-state-icon">📝</div>
                    <h3>加载中...</h3>
                </div>
            </div>
        </main>

        <!-- 右侧边栏 -->
        <aside class="sidebar right-sidebar">
            <!-- 时钟 -->
            <div class="sidebar-card widget-clock">
                <div class="widget-greeting" id="widgetGreeting">晚上好，放松一下！</div>
                <div class="widget-time" id="widgetTime">00:00</div>
                <div class="widget-date" id="widgetDate">--</div>
                <div class="widget-cover">🌙</div>
            </div>

            <!-- 最新文章 -->
            <div class="sidebar-card">
                <div class="sidebar-title">📰 最新文章</div>
                <ul class="recent-list" id="recentList">
                    <li class="recent-item">
                        <div class="recent-title">加载中...</div>
                    </li>
                </ul>
            </div>
        </aside>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        let allPosts = [];
        let currentCategory = '';
        let currentTag = '';

        // 加载文章
        async function loadPosts() {
            try {
                const response = await fetch('/api/posts');
                const data = await response.json();
                if (data.success) {
                    allPosts = data.data;
                    renderFilterBar();
                    renderSidebar();
                    renderPosts();
                    renderRecentPosts();
                }
            } catch (e) {
                document.getElementById('postsGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <h3>加载失败</h3>
                        <p>请稍后重试</p>
                    </div>
                `;
            }
        }

        // 渲染筛选栏
        function renderFilterBar() {
            const categories = new Set();
            allPosts.forEach(p => categories.add(p.category || '未分类'));

            const bar = document.getElementById('filterBar');
            let html = `<div class="filter-tab ${!currentCategory && !currentTag ? 'active' : ''}" data-filter="all">全部 <span class="count">${allPosts.length}</span></div>`;

            categories.forEach(cat => {
                const count = allPosts.filter(p => (p.category || '未分类') === cat).length;
                html += `<div class="filter-tab ${currentCategory === cat ? 'active' : ''}" data-category="${escapeAttr(cat)}">${escapeHtml(cat)} <span class="count">${count}</span></div>`;
            });

            bar.innerHTML = html;

            bar.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    if (this.dataset.filter === 'all') {
                        currentCategory = '';
                        currentTag = '';
                    } else {
                        currentCategory = this.dataset.category;
                        currentTag = '';
                    }
                    renderFilterBar();
                    renderSidebar();
                    renderPosts();
                });
            });
        }

        // 渲染侧边栏
        function renderSidebar() {
            // 分类
            const categories = {};
            allPosts.forEach(p => {
                const cat = p.category || '未分类';
                categories[cat] = (categories[cat] || 0) + 1;
            });

            const catList = document.getElementById('categoryList');
            const catEntries = Object.entries(categories).sort((a, b) => b[1] - a[1]);

            catList.innerHTML = `<li class="${!currentCategory ? 'active' : ''}" data-category="">全部 <span class="category-count">${allPosts.length}</span></li>`;
            catEntries.forEach(([cat, count]) => {
                catList.innerHTML += `<li class="${currentCategory === cat ? 'active' : ''}" data-category="${escapeAttr(cat)}">${escapeHtml(cat)} <span class="category-count">${count}</span></li>`;
            });

            catList.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', function() {
                    currentCategory = this.dataset.category || '';
                    currentTag = '';
                    renderFilterBar();
                    renderSidebar();
                    renderPosts();
                });
            });

            // 标签
            const tags = new Set();
            allPosts.forEach(p => {
                const postTags = Array.isArray(p.tags) ? p.tags : (typeof p.tags === 'string' ? p.tags.split(',').filter(Boolean) : []);
                postTags.forEach(t => tags.add(t));
            });

            const tagList = document.getElementById('tagList');
            if (tags.size === 0) {
                tagList.innerHTML = '<li>暂无标签</li>';
            } else {
                tagList.innerHTML = '';
                tags.forEach(tag => {
                    tagList.innerHTML += `<li class="${currentTag === tag ? 'active' : ''}" data-tag="${escapeAttr(tag)}">#${escapeHtml(tag)}</li>`;
                });
                tagList.querySelectorAll('li').forEach(li => {
                    li.addEventListener('click', function() {
                        currentTag = currentTag === this.dataset.tag ? '' : this.dataset.tag;
                        currentCategory = '';
                        renderFilterBar();
                        renderSidebar();
                        renderPosts();
                    });
                });
            }
        }

        // 渲染文章
        function renderPosts() {
            let posts = [...allPosts];

            // 置顶优先
            posts.sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return new Date(b.date) - new Date(a.date);
            });

            if (currentCategory) {
                posts = posts.filter(p => (p.category || '未分类') === currentCategory);
            }

            if (currentTag) {
                posts = posts.filter(p => {
                    const postTags = Array.isArray(p.tags) ? p.tags : (typeof p.tags === 'string' ? p.tags.split(',').filter(Boolean) : []);
                    return postTags.includes(currentTag);
                });
            }

            const grid = document.getElementById('postsGrid');

            if (posts.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>暂无文章</h3>
                        <p>${currentCategory || currentTag ? '该分类/标签下暂无文章' : '还没有发布任何文章'}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = posts.map((post, index) => {
                const date = new Date(post.date);
                const dateStr = date.toLocaleDateString('zh-CN');
                const tagsArray = Array.isArray(post.tags) ? post.tags : (typeof post.tags === 'string' ? post.tags.split(',').filter(Boolean) : []);
                const tagsHtml = tagsArray.slice(0, 3).map(t => `<span class="post-tag">#${escapeHtml(t)}</span>`).join('');

                return `
                    <article class="post-card ${post.pinned ? 'pinned' : ''}" onclick="location.href='/blog/posts/?id=${post.id}'">
                        <div class="post-cover">
                            ${post.pinned ? '<span class="post-pinned-badge">📌 置顶</span>' : ''}
                            ${post.cover ? `<img src="${escapeAttr(post.cover)}" alt="">` : '📄'}
                        </div>
                        <div class="post-body">
                            <h3 class="post-title">${escapeHtml(post.title)}</h3>
                            <div class="post-meta">
                                <span class="post-meta-item">📅 ${dateStr}</span>
                                <span class="post-meta-item post-category">📁 ${escapeHtml(post.category || '未分类')}</span>
                            </div>
                            <p class="post-excerpt">${escapeHtml(post.excerpt || post.content?.replace(/<[^>]*>/g, '').substring(0, 100) || '暂无摘要')}</p>
                            <div class="post-tags">${tagsHtml}</div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // 渲染最新文章
        function renderRecentPosts() {
            const recent = [...allPosts].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
            const list = document.getElementById('recentList');

            if (recent.length === 0) {
                list.innerHTML = '<li class="recent-item"><div class="recent-title">暂无文章</div></li>';
                return;
            }

            list.innerHTML = recent.map(post => {
                const date = new Date(post.date).toLocaleDateString('zh-CN');
                return `
                    <li class="recent-item" onclick="location.href='/blog/posts/?id=${post.id}'">
                        <div class="recent-title">${escapeHtml(post.title)}</div>
                        <div class="recent-date">${date}</div>
                    </li>
                `;
            }).join('');
        }

        // 时钟
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('widgetTime').textContent = `${hours}:${minutes}`;

            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const dateStr = `${now.getMonth() + 1}/${now.getDate()} ${weekDays[now.getDay()]}`;
            document.getElementById('widgetDate').textContent = dateStr;

            let greeting = '你好';
            if (hours < 6) greeting = '夜深了，注意休息';
            else if (hours < 9) greeting = '早上好，新的一天';
            else if (hours < 12) greeting = '上午好，加油';
            else if (hours < 14) greeting = '中午好，该吃饭了';
            else if (hours < 18) greeting = '下午好，继续努力';
            else if (hours < 22) greeting = '晚上好，放松一下';
            else greeting = '夜深了，早点休息';
            document.getElementById('widgetGreeting').textContent = greeting + '！';
        }

        // 加载个人资料
        async function loadBlogProfile() {
            try {
                const response = await fetch('/api/profile');
                const data = await response.json();
                if (data.success && data.data) {
                    const profile = data.data;
                    const avatarEl = document.getElementById('blogProfileAvatar');
                    if (profile.avatar) {
                        avatarEl.innerHTML = `<img src="${profile.avatar}" alt="">`;
                    }
                    if (profile.name) {
                        document.getElementById('blogProfileName').textContent = profile.name;
                    }
                    if (profile.bio) {
                        document.getElementById('blogProfileBio').textContent = profile.bio;
                    }
                }
            } catch (e) {}
        }

        // 加载博客设置
        async function loadBlogSettings() {
            try {
                const response = await fetch('/api/blog-settings');
                const data = await response.json();
                if (data.success && data.data) {
                    const settings = data.data;
                    // 应用背景
                    applyBlogBackground(settings.backgroundImage, settings.backgroundOpacity);
                    // 渲染联系方式
                    renderContactIcons(settings.contacts || {});
                }
            } catch (e) {}

            // 加载网站名称
            try {
                const siteRes = await fetch('/api/settings');
                const siteData = await siteRes.json();
                if (siteData.success && siteData.data && siteData.data.siteName) {
                    document.getElementById('blogSiteName').textContent = '📝 ' + siteData.data.siteName;
                }
            } catch (e) {}
        }

        // 应用博客背景
        function applyBlogBackground(image, opacity) {
            if (image) {
                document.body.style.backgroundImage = `url(${image})`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
                document.body.style.backgroundColor = '#e8f0f7';
                // 用伪元素实现透明度
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    background: rgba(232, 240, 247, ${1 - (opacity || 1)});
                    z-index: -1; pointer-events: none;
                `;
                document.body.appendChild(overlay);
            }
        }

        // 渲染联系方式图标
        function renderContactIcons(contacts) {
            const container = document.getElementById('profileSocial');
            const icons = [
                { key: 'qq', icon: '🐧', name: 'QQ', url: contacts.qq ? (contacts.qq.startsWith('http') ? contacts.qq : `tencent://message/?uin=${contacts.qq}`) : '' },
                { key: 'email', icon: '✉️', name: 'Email', url: contacts.email ? `mailto:${contacts.email}` : '' },
                { key: 'github', icon: '🐙', name: 'GitHub', url: contacts.github ? (contacts.github.startsWith('http') ? contacts.github : `https://github.com/${contacts.github}`) : '' },
                { key: 'telegram', icon: '✈️', name: 'Telegram', url: contacts.telegram ? (contacts.telegram.startsWith('http') ? contacts.telegram : `https://t.me/${contacts.telegram}`) : '' },
                { key: 'bilibili', icon: '📺', name: '哔哩哔哩', url: contacts.bilibili ? (contacts.bilibili.startsWith('http') ? contacts.bilibili : `https://space.bilibili.com/${contacts.bilibili}`) : '' },
                { key: 'guestbook', icon: '💬', name: '留言箱', url: contacts.guestbook || '/guestbook/' }
            ];

            container.innerHTML = icons.filter(i => i.url).map(i =>
                `<a href="${escapeAttr(i.url)}" class="social-btn" title="${i.name}" target="_blank" rel="noopener">${i.icon}</a>`
            ).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return (text || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadPosts();
            loadBlogProfile();
            loadBlogSettings();
            updateClock();
            setInterval(updateClock, 1000);
        });
    </script>
</body>
</html>
