<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <style>
        .blog-layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
        }

        /* 侧边栏 */
        .sidebar {
            position: sticky;
            top: 100px;
            align-self: start;
        }

        .sidebar-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
        }

        .profile-card {
            text-align: center;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
        }

        .profile-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .profile-bio {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary-color, #667eea);
            display: inline-block;
        }

        .category-list, .tag-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .category-list li {
            padding: 0.4rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .category-list li:hover {
            color: var(--primary-color, #667eea);
        }

        .category-list li.active {
            color: var(--primary-color, #667eea);
            font-weight: 600;
        }

        .category-count {
            background: var(--bg-secondary, #f3f4f6);
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.75rem;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag-list li {
            padding: 0.25rem 0.75rem;
            background: var(--bg-secondary, #f3f4f6);
            border-radius: 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-list li:hover {
            background: var(--primary-color, #667eea);
            color: white;
        }

        .tag-list li.active {
            background: var(--primary-color, #667eea);
            color: white;
        }

        /* 文章列表 */
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.1);
            border-color: var(--primary-color, #667eea);
        }

        .post-card.pinned {
            border-left: 4px solid #f59e0b;
        }

        .post-cover {
            width: 240px;
            min-height: 160px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
        }

        .post-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-content {
            flex: 1;
            padding: 1.25rem 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .post-category {
            background: var(--primary-color, #667eea);
            color: white;
            padding: 0.15rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .post-pinned-badge {
            background: #f59e0b;
            color: white;
            padding: 0.15rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .post-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .post-excerpt {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .post-tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .post-tag {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-secondary, #f3f4f6);
            padding: 0.15rem 0.5rem;
            border-radius: 0.25rem;
        }

        .post-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        @media (max-width: 900px) {
            .blog-layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
            .post-card {
                flex-direction: column;
            }
            .post-cover {
                width: 100%;
                height: 180px;
            }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-card {
            animation: fadeInUp 0.4s ease backwards;
        }
    </style>
</head>
<body>
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
    </div>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="/">My Site</a>
            </div>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/about/">关于我</a></li>
                <li><a href="/blog/" class="active">博客</a></li>
                <li><a href="/drive/">云盘</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="blog-layout">
            <!-- 侧边栏 -->
            <aside class="sidebar">
                <div class="sidebar-card profile-card">
                    <div class="profile-avatar" id="blogProfileAvatar">📝</div>
                    <div class="profile-name" id="blogProfileName">我的博客</div>
                    <div class="profile-bio" id="blogProfileBio">记录生活与技术</div>
                </div>

                <div class="sidebar-card">
                    <div class="sidebar-title">分类</div>
                    <ul class="category-list" id="categoryList">
                        <li class="active" data-category="">全部 <span class="category-count" id="totalCount">0</span></li>
                    </ul>
                </div>

                <div class="sidebar-card">
                    <div class="sidebar-title">标签</div>
                    <ul class="tag-list" id="tagList">
                        <li>暂无标签</li>
                    </ul>
                </div>
            </aside>

            <!-- 文章列表 -->
            <div>
                <div class="posts-list" id="postsList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <h3>加载中...</h3>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/js/main.js"></script>
    <script>
        let allPosts = [];
        let currentCategory = '';
        let currentTag = '';

        async function loadPosts() {
            try {
                const response = await fetch('/api/posts');
                const data = await response.json();
                if (data.success) {
                    allPosts = data.data;
                    renderSidebar();
                    renderPosts();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('postsList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>加载失败</h3>
                        <p>请稍后重试</p>
                    </div>
                `;
            }
        }

        function renderSidebar() {
            // 分类统计
            const categories = {};
            allPosts.forEach(p => {
                categories[p.category] = (categories[p.category] || 0) + 1;
            });

            const categoryList = document.getElementById('categoryList');
            categoryList.innerHTML = `<li class="${currentCategory === '' ? 'active' : ''}" data-category="">全部 <span class="category-count">${allPosts.length}</span></li>`;
            Object.entries(categories).forEach(([cat, count]) => {
                categoryList.innerHTML += `<li class="${currentCategory === cat ? 'active' : ''}" data-category="${escapeAttr(cat)}">${escapeHtml(cat)} <span class="category-count">${count}</span></li>`;
            });

            // 绑定分类点击
            categoryList.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', function() {
                    currentCategory = this.dataset.category;
                    currentTag = '';
                    renderSidebar();
                    renderPosts();
                });
            });

            // 标签统计
            const tags = new Set();
            allPosts.forEach(p => (p.tags || []).forEach(t => tags.add(t)));

            const tagList = document.getElementById('tagList');
            if (tags.size === 0) {
                tagList.innerHTML = '<li>暂无标签</li>';
            } else {
                tagList.innerHTML = '';
                tags.forEach(tag => {
                    tagList.innerHTML += `<li class="${currentTag === tag ? 'active' : ''}" data-tag="${escapeAttr(tag)}">${escapeHtml(tag)}</li>`;
                });
                tagList.querySelectorAll('li').forEach(li => {
                    li.addEventListener('click', function() {
                        currentTag = currentTag === this.dataset.tag ? '' : this.dataset.tag;
                        renderSidebar();
                        renderPosts();
                    });
                });
            }
        }

        function renderPosts() {
            let posts = allPosts;

            if (currentCategory) {
                posts = posts.filter(p => p.category === currentCategory);
            }
            if (currentTag) {
                posts = posts.filter(p => (p.tags || []).includes(currentTag));
            }

            const list = document.getElementById('postsList');

            if (posts.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>暂无文章</h3>
                        <p>${currentCategory || currentTag ? '该分类/标签下暂无文章' : '还没有发布任何文章'}</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = posts.map((post, index) => {
                const date = new Date(post.date);
                const dateStr = date.toLocaleDateString('zh-CN');
                const tagsHtml = (post.tags || []).slice(0, 3).map(t => `<span class="post-tag">#${escapeHtml(t)}</span>`).join('');

                return `
                    <article class="post-card ${post.pinned ? 'pinned' : ''}" style="animation-delay:${index * 0.05}s" onclick="location.href='/blog/posts/?id=${post.id}'">
                        <div class="post-cover">
                            ${post.cover ? `<img src="${escapeAttr(post.cover)}" alt="">` : '📄'}
                        </div>
                        <div class="post-content">
                            <div class="post-meta">
                                ${post.pinned ? '<span class="post-pinned-badge">📌 置顶</span>' : ''}
                                <span class="post-category">${escapeHtml(post.category || '未分类')}</span>
                            </div>
                            <h2 class="post-title">${escapeHtml(post.title)}</h2>
                            <p class="post-excerpt">${escapeHtml(post.excerpt || '暂无摘要')}</p>
                            <div class="post-footer">
                                <div class="post-tags">${tagsHtml}</div>
                                <span class="post-date">${dateStr}</span>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // 加载个人资料（与个人主页同步）
        async function loadBlogProfile() {
            try {
                const response = await fetch('/api/profile');
                const data = await response.json();
                if (data.success && data.data) {
                    const profile = data.data;
                    // 头像
                    const avatarEl = document.getElementById('blogProfileAvatar');
                    if (profile.avatar) {
                        avatarEl.innerHTML = `<img src="${profile.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                        avatarEl.style.background = 'transparent';
                    }
                    // 名称
                    if (profile.name) {
                        document.getElementById('blogProfileName').textContent = profile.name;
                    }
                    // 简介
                    if (profile.bio) {
                        document.getElementById('blogProfileBio').textContent = profile.bio;
                    }
                }
            } catch (e) {
                // 加载失败保持默认
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadPosts();
            loadBlogProfile();
        });
    </script>
</body>
</html>
