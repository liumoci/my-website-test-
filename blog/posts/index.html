<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../../assets/images/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #e8f0f7;
            min-height: 100vh;
        }

        .post-detail {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .post-wrapper {
            background: white;
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            background: #eef0ff;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
        }

        .post-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .post-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #888;
        }

        .post-category {
            background: #667eea;
            color: white;
            padding: 0.2rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .post-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .post-tag {
            font-size: 0.8rem;
            color: #667eea;
            background: #eef0ff;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
        }

        .post-content {
            font-size: 1rem;
            line-height: 1.8;
            color: #333;
        }

        .post-content h1, .post-content h2, .post-content h3 {
            margin: 1.5rem 0 0.75rem;
            font-weight: 600;
        }

        .post-content h1 { font-size: 1.75rem; }
        .post-content h2 { font-size: 1.5rem; }
        .post-content h3 { font-size: 1.25rem; }

        .post-content p {
            margin-bottom: 1rem;
        }

        .post-content code {
            background: var(--bg-secondary, #f3f4f6);
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            font-size: 0.9em;
            font-family: monospace;
        }

        .post-content pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .post-content pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        .post-content blockquote {
            border-left: 4px solid var(--primary-color, #667eea);
            padding-left: 1rem;
            margin: 1rem 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .post-content img {
            max-width: 100%;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        .post-content ul, .post-content ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }

        .post-content li {
            margin-bottom: 0.5rem;
        }

        .post-content a {
            color: var(--primary-color, #667eea);
            text-decoration: none;
        }

        .post-content a:hover {
            text-decoration: underline;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--primary-color, #667eea);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
    </div>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="/">My Site</a>
            </div>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/about/">关于我</a></li>
                <li><a href="/blog/" class="active">博客</a></li>
                <li><a href="/drive/">云盘</a></li>
                <li><a href="/guestbook/">留言</a></li>
                <li><a href="/admin/">管理</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="post-detail" id="postDetail">
            <a href="/blog/" class="back-btn">← 返回博客列表</a>
            <div class="empty-state">
                <div class="empty-state-icon">📝</div>
                <h3>加载中...</h3>
            </div>
        </div>
    </main>

    <script src="../../assets/js/main.js"></script>
    <script>
        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                showNotFound();
                return;
            }

            try {
                const response = await fetch(`/api/posts/${id}`);
                const data = await response.json();

                if (!data.success) {
                    showNotFound();
                    return;
                }

                renderPost(data.data);
            } catch (err) {
                console.error(err);
                showNotFound();
            }
        }

        function renderPost(post) {
            const date = new Date(post.date);
            const dateStr = date.toLocaleDateString('zh-CN');
            const tagsArray = Array.isArray(post.tags) ? post.tags : (typeof post.tags === 'string' ? post.tags.split(',').filter(Boolean) : []);
            const tagsHtml = tagsArray.map(t => `<span class="post-tag">#${escapeHtml(t)}</span>`).join('');

            document.getElementById('postDetail').innerHTML = `
                <a href="/blog/" class="back-btn">← 返回博客列表</a>
                <div class="post-wrapper">
                    <header class="post-header">
                        <h1 class="post-title">${escapeHtml(post.title)}</h1>
                        <div class="post-meta">
                            <span class="post-category">${escapeHtml(post.category || '未分类')}</span>
                            <span>📅 ${dateStr}</span>
                            <span>⏱️ ${post.readTime || 1} 分钟阅读</span>
                        </div>
                        <div class="post-tags">${tagsHtml}</div>
                    </header>
                    <article class="post-content">
                        ${post.content || '<p>暂无内容</p>'}
                    </article>
                </div>
            `;

            document.title = post.title + ' - 博客';
        }

        function showNotFound() {
            document.getElementById('postDetail').innerHTML = `
                <a href="/blog/" class="back-btn">← 返回博客列表</a>
                <div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <h3>文章不存在</h3>
                    <p>该文章可能已被删除或不存在</p>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', loadPost);
    </script>
</body>
</html>
