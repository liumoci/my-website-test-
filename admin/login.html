<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 管理面板</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h1 id="formTitle">管理面板</h1>
            <p id="formSubtitle" class="login-subtitle">请登录以继续</p>
            
            <!-- 登录表单 -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <div class="form-group form-check">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">记住我（30天）</label>
                </div>
                
                <button type="submit" class="btn-login">登 录</button>
                
                <p id="errorMsg" class="error-msg"></p>
                <p id="successMsg" class="success-msg"></p>
            </form>
            
            <!-- 初始化表单（首次设置账号） -->
            <form id="initForm" class="login-form" style="display: none;">
                <div class="form-group">
                    <label for="initSecret">初始化密钥</label>
                    <input type="password" id="initSecret" name="initSecret" placeholder="如果配置了的话">
                </div>
                
                <div class="form-group">
                    <label for="initUsername">设置用户名</label>
                    <input type="text" id="initUsername" name="initUsername" required>
                </div>
                
                <div class="form-group">
                    <label for="initPassword">设置密码</label>
                    <input type="password" id="initPassword" name="initPassword" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="initPassword2">确认密码</label>
                    <input type="password" id="initPassword2" name="initPassword2" required minlength="6">
                </div>
                
                <button type="submit" class="btn-login">创建账号</button>
                
                <p id="initErrorMsg" class="error-msg"></p>
                <p id="initSuccessMsg" class="success-msg"></p>
            </form>
            
            <!-- 重置密码表单 -->
            <form id="resetForm" class="login-form" style="display: none;">
                <div class="form-group">
                    <label for="resetSecret">重置密钥</label>
                    <input type="password" id="resetSecret" name="resetSecret" required>
                </div>
                
                <div class="form-group">
                    <label for="resetUsername">新用户名</label>
                    <input type="text" id="resetUsername" name="resetUsername" required>
                </div>
                
                <div class="form-group">
                    <label for="resetPassword">新密码</label>
                    <input type="password" id="resetPassword" name="resetPassword" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="resetPassword2">确认新密码</label>
                    <input type="password" id="resetPassword2" name="resetPassword2" required minlength="6">
                </div>
                
                <button type="submit" class="btn-login">重置密码</button>
                
                <p id="resetErrorMsg" class="error-msg"></p>
                <p id="resetSuccessMsg" class="success-msg"></p>
            </form>
            
            <div class="login-footer">
                <a href="#" id="toggleInit">首次使用？创建账号</a>
                <br>
                <a href="#" id="toggleReset">忘记密码？重置账号</a>
                <br>
                <a href="/">← 返回首页</a>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
