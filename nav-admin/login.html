<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航管理 - 登录</title>
    <link rel="stylesheet" href="assets/css/nav-admin.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-icon">🔗</div>
            <h1>导航管理</h1>
            <p class="login-subtitle">请输入密码以继续</p>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="password">管理密码</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="与管理面板密码相同">
                </div>
                
                <button type="submit" class="btn-login">登 录</button>
                
                <p id="errorMsg" class="error-msg"></p>
            </form>
            
            <div class="login-footer">
                <a href="/">← 返回首页</a>
            </div>
        </div>
    </div>

    <script src="assets/js/nav-auth.js"></script>
</body>
</html>
