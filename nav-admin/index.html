<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航管理</title>
    <link rel="stylesheet" href="assets/css/nav-admin.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-content">
            <h1>🔗 导航管理</h1>
            <div class="top-actions">
                <button id="saveBtn" class="btn-primary">保存更改</button>
                <button id="logoutBtn" class="btn-secondary">退出</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="statusMsg" class="status-msg"></div>
        
        <div class="categories-container" id="categoriesContainer">
            <!-- 分类和链接动态生成 -->
        </div>
        
        <div class="add-category-section">
            <button id="addCategoryBtn" class="btn-secondary btn-block">+ 添加分类</button>
        </div>
    </main>

    <!-- 添加/编辑链接弹窗 -->
    <div id="linkModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="modalTitle">添加链接</h2>
            <form id="linkForm">
                <div class="form-group">
                    <label>名称</label>
                    <input type="text" id="linkName" required>
                </div>
                <div class="form-group">
                    <label>网址</label>
                    <input type="url" id="linkUrl" required placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>图标（emoji，可选）</label>
                    <input type="text" id="linkIcon" placeholder="🔗">
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelModalBtn" class="btn-secondary">取消</button>
                    <button type="submit" class="btn-primary">确定</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 添加分类弹窗 -->
    <div id="categoryModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>添加分类</h2>
            <form id="categoryForm">
                <div class="form-group">
                    <label>分类名称</label>
                    <input type="text" id="categoryName" required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelCategoryBtn" class="btn-secondary">取消</button>
                    <button type="submit" class="btn-primary">确定</button>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/nav-admin.js"></script>
</body>
</html>
