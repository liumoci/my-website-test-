<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
</head>
<body>
    <!-- 页面加载动画 -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
    </div>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="/">My Site</a>
            </div>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/about/" class="active">关于我</a></li>
                <li><a href="/blog/">博客</a></li>
                <li><a href="/drive/">云盘</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="profile">
            <div class="avatar" id="profileAvatar">
                <img src="../assets/images/avatar.png" alt="头像" width="150" height="150">
            </div>
            <h1 id="profileName">加载中...</h1>
            <p class="bio" id="profileBio">加载中...</p>
        </section>

        <section class="skills" id="skillsSection">
            <h2>技能</h2>
            <ul id="skillsList">
                <li>加载中...</li>
            </ul>
        </section>

        <section class="projects" id="projectsSection">
            <h2>项目</h2>
            <div class="project-list" id="projectsList">
                <div class="project-item">
                    <h3>加载中...</h3>
                </div>
            </div>
        </section>

        <section class="contact" id="contactSection">
            <h2>联系方式</h2>
            <div id="contactList">
                <p>加载中...</p>
            </div>
        </section>

        <!-- 留言箱 -->
        <section class="guestbook">
            <h2>💬 留言板</h2>
            <div class="guestbook-form">
                <form id="messageForm">
                    <div class="form-group">
                        <input type="text" id="messageName" placeholder="你的昵称" required maxlength="50">
                    </div>
                    <div class="form-group">
                        <textarea id="messageContent" placeholder="说点什么吧..." required maxlength="500" rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">提交留言</button>
                    <span id="messageFormMsg" class="form-msg"></span>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Site. Powered by Cloudflare Pages.</p>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/about.js"></script>
</body>
</html>
