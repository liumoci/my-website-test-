<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: #c7e0f4;
            min-height: 100vh;
            color: #333;
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }
        .page-wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        /* 顶部 */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
        }
        .avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .avatar {
            width: 130px; height: 130px;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            background: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-emoji {
            position: absolute;
            bottom: 5px; right: 0;
            font-size: 1.6rem;
            background: #fff;
            border-radius: 50%;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header-info h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .header-info h1 .name {
            background: linear-gradient(90deg, #ff8fab, #ffb3c6, #ff8fab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }
        .location-tags {
            display: flex; gap: 0.5rem; flex-wrap: wrap;
        }
        .loc-tag {
            background: rgba(255,255,255,0.7);
            padding: 0.3rem 0.8rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            color: #666;
        }
        /* 两栏布局 */
        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.25rem;
        }
        .card {
            background: rgba(255,255,255,0.85);
            border-radius: 1.25rem;
            padding: 1.25rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
        }
        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #444;
        }
        /* 待办计划 */
        .todo-list { list-style: none; }
        .todo-item {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.6rem 0;
            border-bottom: 2px dashed #e0e0e0;
        }
        .todo-item:last-child { border-bottom: none; }
        .todo-circle {
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 2px solid #bbb;
            flex-shrink: 0;
        }
        .todo-item.done .todo-circle {
            background: #86efac; border-color: #86efac;
        }
        .todo-text { font-size: 0.95rem; color: #555; }
        .todo-item.done .todo-text { text-decoration: line-through; color: #aaa; }
        /* 时光进度 */
        .time-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .time-item .time-label {
            display: flex; justify-content: space-between;
            font-size: 0.85rem; color: #777;
            margin-bottom: 0.3rem;
        }
        .time-bar {
            height: 8px; background: #eee; border-radius: 4px; overflow: hidden;
        }
        .time-fill {
            height: 100%; border-radius: 4px;
            background: linear-gradient(90deg, #fca5a5, #f9a8d4);
        }
        /* 自我介绍 */
        .bio-text {
            line-height: 2;
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        .bio-text .highlight {
            background: linear-gradient(transparent 60%, #fde68a 60%);
            padding: 0 2px;
        }
        /* 技术栈 */
        .tech-section { margin-top: 1rem; }
        .tech-section h4 { font-size: 1rem; margin-bottom: 0.75rem; color: #555; }
        .tech-icons {
            display: flex; flex-wrap: wrap; gap: 0.6rem;
        }
        .tech-icon {
            width: 44px; height: 44px;
            background: #f0f7ff;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
        }
        /* 引用语 */
        .quote-card {
            margin-top: 1.25rem;
            text-align: center;
            padding: 1rem;
            font-size: 1rem;
            color: #666;
            font-style: italic;
        }
        /* 社交按钮 */
        .social-row {
            display: flex; flex-wrap: wrap; gap: 0.75rem;
            margin-top: 1.25rem;
            justify-content: center;
        }
        .social-btn {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.7rem 1.5rem;
            border-radius: 1rem;
            color: #fff; text-decoration: none;
            font-size: 0.95rem; font-weight: 500;
            transition: transform 0.2s;
        }
        .social-btn:hover { transform: translateY(-2px); }
        .sb-blog { background: #f472b6; }
        .sb-github { background: #374151; }
        .sb-bilibili { background: #38bdf8; }
        .sb-email { background: #fbbf24; }
        .sb-qq { background: #60a5fa; }
        .sb-telegram { background: #229ed9; }
        .sb-guestbook { background: #34d399; }
        .sb-music { background: #f43f5e; }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            .profile-header { flex-direction: column; text-align: center; }
            .location-tags { justify-content: center; }
            .header-info h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="bg-overlay" id="bgOverlay"></div>

    <header>
        <nav class="navbar">
            <div class="logo"><a href="/" id="siteName">My Site</a></div>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/about/" class="active">关于我</a></li>
                <li><a href="/blog/">博客</a></li>
                <li><a href="/drive/">云盘</a></li>
                <li><a href="/guestbook/">留言</a></li>
            </ul>
        </nav>
    </header>

    <div class="page-wrap">
        <!-- 顶部 -->
        <div class="profile-header">
            <div class="avatar-wrap">
                <div class="avatar" id="aboutAvatar">👤</div>
                <div class="avatar-emoji" id="aboutAvatarEmoji">😊</div>
            </div>
            <div class="header-info">
                <h1>Hi, I'm <span class="name" id="aboutName">加载中...</span></h1>
                <div class="location-tags" id="locationTags"></div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main-grid">
            <!-- 左侧 -->
            <div>
                <div class="card">
                    <h3>📝 我的一些鸽子计划</h3>
                    <ul class="todo-list" id="todoList">
                        <li class="todo-item"><div class="todo-circle"></div><span class="todo-text">加载中...</span></li>
                    </ul>
                </div>
                <div class="card" style="margin-top:1.25rem;">
                    <h3>⏰ 时光</h3>
                    <div class="time-list" id="timeList"></div>
                </div>
            </div>

            <!-- 右侧 -->
            <div>
                <div class="card">
                    <p class="bio-text" id="aboutBio">加载中...</p>
                    <div class="tech-section">
                        <h4>🛠 我的一些技术栈</h4>
                        <div class="tech-icons" id="techStack"></div>
                    </div>
                </div>
                <div class="card quote-card" id="aboutQuote">你好鸭，欢迎来到我的主页</div>
                <div class="social-row" id="socialLinks"></div>
            </div>
        </div>
    </div>

    <script>
        async function loadProfile() {
            try {
                const res = await fetch('/api/profile');
                const data = await res.json();
                if (data.success && data.data && typeof data.data === 'object') {
                    applyProfile(data.data);
                } else {
                    document.getElementById('aboutName').textContent = '加载失败';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('aboutName').textContent = '加载失败';
            }
        }

        function applyProfile(p) {
            // 背景
            applyBg(p);
            // 头像
            const av = document.getElementById('aboutAvatar');
            if (p.avatar && p.avatar.startsWith('http')) {
                av.innerHTML = '<img src="' + p.avatar + '" alt="头像">';
            }
            document.getElementById('aboutAvatarEmoji').textContent = p.avatarEmoji || '😊';
            // 名字
            document.getElementById('aboutName').textContent = p.name || '我的名字';
            // 位置标签
            const tags = [];
            if (p.contact && p.contact.location) tags.push(p.contact.location);
            if (p.contact && p.contact.school) tags.push(p.contact.school);
            document.getElementById('locationTags').innerHTML = tags.map(t =>
                '<span class="loc-tag">📍 ' + t + '</span>'
            ).join('');
            // 简介
            document.getElementById('aboutBio').innerHTML = p.bio || '这是我的个人简介';
            // 引用语
            if (p.quote) document.getElementById('aboutQuote').textContent = '❝ ' + p.quote + ' ❞';
            // 技术栈
            if (p.skills && p.skills.length > 0) {
                const icons = ['🟧','🟦','🟨','🟩','🟪','🟥','🟫','⬛','🟧','🟦'];
                document.getElementById('techStack').innerHTML = p.skills.slice(0,10).map((s,i) =>
                    '<div class="tech-icon" title="' + s + '">' + (icons[i] || '💻') + '</div>'
                ).join('');
            }
            // 待办
            const todos = p.todos || (p.projects || []).map(x => ({text:x.name, done:false}));
            if (todos && todos.length > 0) {
                document.getElementById('todoList').innerHTML = todos.map(t =>
                    '<li class="todo-item ' + (t.done?'done':'') + '">' +
                    '<div class="todo-circle"></div><span class="todo-text">' + (t.text||'计划') + '</span></li>'
                ).join('');
            }
            // 社交
            renderSocial(p.contact || {});
        }

        function applyBg(p) {
            if (p.backgroundImage && p.backgroundImage.startsWith('http')) {
                document.body.style.backgroundImage = 'url(' + p.backgroundImage + ')';
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
                const opacity = p.backgroundOpacity != null ? p.backgroundOpacity : 0.5;
                const blur = p.backgroundBlur != null ? p.backgroundBlur : 0;
                document.getElementById('bgOverlay').style.background = 'rgba(199,224,244,' + (1-opacity) + ')';
                document.getElementById('bgOverlay').style.backdropFilter = 'blur(' + blur + 'px)';
                document.getElementById('bgOverlay').style.webkitBackdropFilter = 'blur(' + blur + 'px)';
            }
        }

        function renderSocial(c) {
            const links = [];
            if (c.blog) links.push({icon:'📝',text:'博客',url:c.blog,cls:'sb-blog'});
            if (c.github) links.push({icon:'🐙',text:'Github',url:c.github.startsWith('http')?c.github:'https://github.com/'+c.github,cls:'sb-github'});
            if (c.bilibili) links.push({icon:'📺',text:'哔哩哔哩',url:c.bilibili.startsWith('http')?c.bilibili:'https://space.bilibili.com/'+c.bilibili,cls:'sb-bilibili'});
            if (c.email) links.push({icon:'✉️',text:'邮箱',url:'mailto:'+c.email,cls:'sb-email'});
            if (c.qq) links.push({icon:'🐧',text:'QQ',url:'tencent://message/?uin='+c.qq,cls:'sb-qq'});
            if (c.telegram) links.push({icon:'✈️',text:'TG',url:c.telegram.startsWith('http')?c.telegram:'https://t.me/'+c.telegram,cls:'sb-telegram'});
            if (c.music) links.push({icon:'🎵',text:'网易云',url:c.music,cls:'sb-music'});
            links.push({icon:'💬',text:'留言箱',url:'/guestbook/',cls:'sb-guestbook'});
            document.getElementById('socialLinks').innerHTML = links.map(l =>
                '<a href="' + l.url + '" class="social-btn ' + l.cls + '" target="_blank">' + l.icon + ' ' + l.text + '</a>'
            ).join('');
        }

        function updateTime() {
            const now = new Date();
            const items = [
                {label:'🌅 今天已经过去了', cur: now.getHours()*60+now.getMinutes(), total: 24*60, unit:'小时'},
                {label:'📅 本周已经过去了', cur: now.getDay(), total: 7, unit:'天'},
                {label:'🌙 本月已经过去了', cur: now.getDate(), total: new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), unit:'天'},
                {label:'⭐ 今年已经过去了', cur: Math.floor((now - new Date(now.getFullYear(),0,1))/86400000), total: 365, unit:'天'}
            ];
            document.getElementById('timeList').innerHTML = items.map(it => {
                const pct = Math.min(100, (it.cur/it.total)*100);
                return '<div class="time-item"><div class="time-label"><span>' + it.label + ' ' + it.cur + ' / ' + it.total + ' ' + it.unit + '</span></div><div class="time-bar"><div class="time-fill" style="width:' + pct + '%"></div></div></div>';
            }).join('');
        }

        async function loadSiteName() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                if (data.success && data.data && data.data.siteName) {
                    document.getElementById('siteName').textContent = data.data.siteName;
                    document.title = '关于我 - ' + data.data.siteName;
                }
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadProfile();
            loadSiteName();
            updateTime();
            setInterval(updateTime, 60000);
        });
    </script>
</body>
</html>
