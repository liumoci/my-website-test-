<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/guestbook.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
</head>
<body>
    <!-- 页面加载动画 -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-spinner"></div>
    </div>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="/">My Site</a>
            </div>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/about/">关于我</a></li>
                <li><a href="/blog/">博客</a></li>
                <li><a href="/drive/">云盘</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="guestbook-container">
            <h1 class="guestbook-title">💬 留言板</h1>
            <p class="guestbook-subtitle">有什么想说的，都可以在这里留言</p>

            <!-- 留言表单 -->
            <div class="guestbook-form-card">
                <form id="messageForm">
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="messageName" placeholder="你的昵称" required maxlength="50">
                        </div>
                    </div>
                    <div class="form-group">
                        <textarea id="messageContent" placeholder="说点什么吧..." required maxlength="500" rows="4"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">提交留言</button>
                        <span id="messageFormMsg" class="form-msg"></span>
                    </div>
                </form>
            </div>

            <!-- 留言列表 -->
            <div class="guestbook-list">
                <div class="guestbook-list-header">
                    <h2>全部留言</h2>
                    <span id="messageCount" class="message-count">(0)</span>
                </div>
                <div id="messagesList" class="messages-list">
                    <p style="text-align: center; color: var(--text-secondary); padding: 2rem;">加载中...</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Site. Powered by Cloudflare Pages.</p>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/guestbook.js"></script>
</body>
</html>
